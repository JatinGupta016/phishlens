<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishLens - Fake SMS Detector</title>
    <!-- Elegant Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Luxury Gradient Background */
        body { 
            font-family: 'Poppins', sans-serif; 
            max-width: 700px; 
            margin: 40px auto; 
            padding: 20px; 
            /* Beige, Cream, and Peach Gradient */
            background: linear-gradient(135deg, #FDFBF7 0%, #F5EAE1 50%, #EFC9B7 100%);
            background-attachment: fixed;
            color: #4a4a4a; 
        }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 3.2em; color: #2c2c2c; margin-bottom: 5px; }
        
        /* New Subheading */
        .sub-heading { font-weight: 600; color: #b56a45; letter-spacing: 3px; text-transform: uppercase; margin-top: 0; font-size: 1.1em; }
        .description { color: #7a7a7a; font-size: 0.95em; margin-top: 10px; }

        /* Glassmorphism Styling for the boxes */
        .upload-box, .card { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05); 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.5); 
        }
        
        .upload-box { margin-bottom: 20px; }
        .upload-box h3 { color: #4a4a4a; margin-top: 0; font-weight: 600;}
        
        .divider { margin: 25px 0; font-weight: bold; color: #bcaaa4; display: flex; align-items: center; justify-content: center;}
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #e0d4cc; margin: 0 15px; }
        
        input[type="file"] { margin-bottom: 15px; font-family: 'Poppins', sans-serif; }
        textarea { 
            width: 100%; 
            box-sizing: border-box;
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #e0d4cc; 
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit; 
            margin-bottom: 25px; 
            resize: vertical; 
            transition: all 0.3s;
        }
        textarea:focus { outline: none; border-color: #d08c60; box-shadow: 0 0 10px rgba(208, 140, 96, 0.2); }
        
        button { 
            background: linear-gradient(45deg, #d08c60, #b56a45); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            cursor: pointer; 
            border-radius: 12px; 
            font-weight: 600; 
            width: 100%; 
            transition: transform 0.2s, box-shadow 0.2s; 
            font-size: 1.1em; 
            letter-spacing: 1px;
        }
        button:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(181, 106, 69, 0.3); 
        }
        
        /* Colorful Gradient Animation for Loading Text */
        #loading { 
            display: none; 
            text-align: center; 
            font-weight: 600; 
            margin-top: 30px; 
            font-size: 1.3em;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gradientText 2.5s linear infinite;
        }
        @keyframes gradientText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        
        /* Result Cards */
        .card { display: none; margin-top: 30px; text-align: left; }
        .danger { border-top: 8px solid #ff4757; }
        .safe { border-top: 8px solid #2ed573; }
        .verdict-title { font-size: 1.8em; margin-top: 0; font-family: 'Playfair Display', serif; }
        .danger .verdict-title { color: #ff4757; }
        .safe .verdict-title { color: #2ed573; }
        
        .data-point { 
            background: rgba(255, 255, 255, 0.8); 
            padding: 12px 15px; 
            border-radius: 8px; 
            font-family: monospace; 
            word-break: break-all; 
            border-left: 4px solid #d08c60;
            color: #333;
        }
        
        .report-box { 
            background: rgba(255, 245, 235, 0.8); 
            border-left: 4px solid #f3a683; 
            padding: 20px; 
            margin-top: 25px; 
            border-radius: 8px; 
        }
        .report-box h4 { margin-top: 0; color: #b56a45; font-size: 1.1em;}
    </style>
</head>
<body>

    <div class="header">
        <h1>PhishLens 🛡️</h1>
        <div class="sub-heading">Fake SMS Detector</div>
        <p class="description">AI-Powered SMS Phishing (Smishing) Forensics</p>
    </div>

    <div class="upload-box">
        <h3>Option 1: Upload Screenshot</h3>
        <input type="file" id="imageInput" accept="image/*">
        
        <div class="divider">OR</div>
        
        <h3>Option 2: Paste Text or URL</h3>
        <textarea id="textInput" rows="3" placeholder="Paste the suspicious SMS message or raw link here..."></textarea>
        
        <button onclick="analyzeInput()">Scan with AI</button>
    </div>
    
    <div id="loading">🤖 AI is reading the input and analyzing the URL... Please wait.</div>

    <div id="resultCard" class="card">
        <h2 id="verdict" class="verdict-title"></h2>
        <p><strong>Extracted URL:</strong></p>
        <div id="resUrl" class="data-point"></div>
        <p><strong>Extracted Message:</strong></p>
        <div id="resMsg" class="data-point"></div>
        <div class="report-box">
            <h4>AI Threat Intelligence Report</h4>
            <p id="resReport" style="margin-bottom: 0; line-height: 1.6;"></p>
        </div>
    </div>

    <script>
        async function analyzeInput() {
            const fileInput = document.getElementById('imageInput');
            const textInput = document.getElementById('textInput').value.trim();
            const file = fileInput.files[0];

            if (!file && !textInput) return alert("Please upload an image OR paste some text first!");

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultCard').style.display = 'none';

            const formData = new FormData();
            if (file) formData.append("file", file);
            if (textInput) formData.append("text_input", textInput);

            try {
                const response = await fetch('/api/analyze_smishing', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                document.getElementById('loading').style.display = 'none';

                if (data.error) return alert("Backend Error: " + data.error);

                const card = document.getElementById('resultCard');
                card.style.display = 'block';
                card.className = data.is_malicious ? 'card danger' : 'card safe';
                
                document.getElementById('verdict').innerText = data.is_malicious ? '🚨 HIGH RISK: SCAM DETECTED' : '✅ SAFE LINK';
                document.getElementById('resUrl').innerText = data.url;
                document.getElementById('resMsg').innerText = data.message;
                document.getElementById('resReport').innerText = data.report;
                
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                alert("Failed to connect to the server.");
            }
        }
    </script>
</body>
</html>
